<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Group UID Finder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); color:#e2e8f0; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:16px;
    padding:40px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  h1 { color:#22d3ee; font-size:24px; margin-bottom:8px; text-align:center; }
  .sub { color:#94a3b8; font-size:13px; text-align:center; margin-bottom:30px; }
  label { display:block; color:#cbd5e1; font-size:13px; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:8px; border:1px solid #334155;
    background:#0f172a; color:#e2e8f0; font-size:14px; margin-bottom:18px; outline:none; }
  input:focus { border-color:#22d3ee; }
  button { width:100%; padding:12px; border:none; border-radius:8px;
    background:linear-gradient(135deg,#06b6d4,#0891b2); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer; }
  .error { color:#f87171; font-size:13px; text-align:center; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔍 Group UID Finder</h1>
    <div class="sub">Sign in to continue</div>
    <form id="form">
      <label>Username</label>
      <input type="text" id="username" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button type="submit">Sign In</button>
      <div class="error" id="err"></div>
    </form>
  </div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    })
  });
  const data = await r.json();
  if (data.success) window.location.href = '/';
  else err.textContent = data.error || 'Login failed';
});
</script>
</body>
</html>
