<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group UID Finder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#0f172a; color:#e2e8f0; min-height:100vh; }

  header { background:#1e293b; border-bottom:1px solid #334155;
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100; }
  header h1 { color:#22d3ee; font-size:18px; }
  .logout { background:#334155; color:#e2e8f0; border:none; padding:8px 16px;
    border-radius:6px; cursor:pointer; font-size:13px; }
  .logout:hover { background:#475569; }

  .container { max-width:1300px; margin:0 auto; padding:24px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:12px;
    padding:24px; margin-bottom:24px; }
  .card h2 { color:#22d3ee; font-size:16px; margin-bottom:16px; }

  .row { display:flex; gap:12px; flex-wrap:wrap; }
  input, select { flex:1; min-width:200px; padding:11px 14px; border-radius:8px;
    border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:14px; outline:none; }
  input:focus { border-color:#22d3ee; }
  button.primary { background:linear-gradient(135deg,#06b6d4,#0891b2); color:#fff;
    border:none; padding:11px 24px; border-radius:8px; cursor:pointer;
    font-size:14px; font-weight:600; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }

  .session { background:#0f172a; border:1px solid #334155; border-radius:10px;
    padding:16px; margin-bottom:16px; }
  .session-head { display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; margin-bottom:12px; }
  .session-title { display:flex; align-items:center; gap:10px; font-weight:600; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:#64748b; }
  .dot.online { background:#22c55e; box-shadow:0 0 8px #22c55e; }
  .dot.offline { background:#ef4444; }
  .badge { background:#334155; color:#cbd5e1; padding:3px 10px;
    border-radius:20px; font-size:12px; }
  .badge.green { background:#064e3b; color:#6ee7b7; }
  .badge.blue { background:#0c4a6e; color:#7dd3fc; }
  .badge.amber { background:#78350f; color:#fcd34d; }
  .badge.purple { background:#4c1d95; color:#c4b5fd; }

  .session-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .session-actions button { background:#334155; color:#e2e8f0; border:none;
    padding:7px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  .session-actions button:hover { background:#475569; }
  .session-actions button.danger { background:#7f1d1d; }
  .session-actions button.danger:hover { background:#991b1b; }

  .pairing-code { background:#0c4a6e; border:1px solid #0ea5e9;
    border-radius:8px; padding:12px 16px; margin-top:12px; text-align:center; }
  .pairing-code .code { font-size:28px; font-weight:700; color:#7dd3fc;
    letter-spacing:4px; font-family:'Courier New',monospace; margin:8px 0; }
  .pairing-code .hint { font-size:12px; color:#94a3b8; }

  /* Groups grid */
  .groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:12px; margin-top:14px; }
  .group-card { background:#1e293b; border:1px solid #334155; border-radius:10px;
    padding:14px; cursor:pointer; transition:.2s; }
  .group-card:hover { border-color:#22d3ee; transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(34,211,238,0.15); }
  .group-card .name { font-weight:600; color:#e2e8f0; margin-bottom:8px;
    display:flex; align-items:center; gap:8px; }
  .group-card .uid { font-family:'Courier New',monospace; color:#22d3ee;
    font-size:12px; word-break:break-all; margin-bottom:8px; }
  .group-card .meta { display:flex; gap:8px; flex-wrap:wrap; font-size:11px; }

  .empty { color:#64748b; text-align:center; padding:20px; font-size:14px; }
  .error-msg { color:#f87171; font-size:13px; margin-top:10px; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; z-index:200;
    padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:#1e293b; border:1px solid #334155; border-radius:14px;
    width:100%; max-width:800px; max-height:88vh; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,0.6); }
  .modal-head { padding:18px 22px; border-bottom:1px solid #334155;
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .modal-head h3 { color:#22d3ee; font-size:17px; margin-bottom:6px; }
  .modal-head .uid-line { font-family:'Courier New',monospace; color:#7dd3fc;
    font-size:12px; word-break:break-all; }
  .modal-close { background:#334155; color:#e2e8f0; border:none;
    padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  .modal-close:hover { background:#475569; }
  .modal-body { padding:18px 22px; overflow-y:auto; flex:1; }
  .modal-actions { padding:12px 22px; border-top:1px solid #334155;
    display:flex; gap:10px; justify-content:flex-end; }

  /* Members list */
  .member { display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:8px; border:1px solid #334155;
    margin-bottom:8px; background:#0f172a; }
  .member:hover { border-color:#475569; }
  .member img, .member .avatar {
    width:44px; height:44px; border-radius:50%; object-fit:cover;
    background:#334155; display:flex; align-items:center; justify-content:center;
    color:#94a3b8; font-weight:700; font-size:16px; flex-shrink:0;
  }
  .member .info { flex:1; min-width:0; }
  .member .phone { color:#e2e8f0; font-weight:600; font-size:14px; }
  .member .phone.lid { color:#94a3b8; font-style:italic; font-weight:500; }
  .member .jid { color:#64748b; font-family:'Courier New',monospace;
    font-size:11px; word-break:break-all; margin-top:2px; }
  .member .role { font-size:11px; padding:3px 8px; border-radius:20px;
    background:#334155; color:#cbd5e1; }
  .member .role.super { background:#78350f; color:#fcd34d; }
  .member .role.admin { background:#0c4a6e; color:#7dd3fc; }

  .search-box { margin-bottom:14px; }
  .search-box input { width:100%; }

  .copy-toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:#065f46; color:#6ee7b7; padding:12px 24px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:.3s; z-index:1000; }
  .copy-toast.show { opacity:1; }

  .stat-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;
    font-size:12px; color:#94a3b8; }
  .stat-row .s { background:#0f172a; padding:6px 12px; border-radius:6px;
    border:1px solid #334155; }
</style>
</head>
<body>

<header>
  <h1>🔍 Group UID Finder</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">
  <div class="card">
    <h2>➕ Create New Session</h2>
    <div class="row">
      <input type="tel" id="phoneInput" placeholder="WhatsApp number with country code (e.g. 923001234567)">
      <button class="primary" id="createBtn" onclick="createSession()">Get Pairing Code</button>
    </div>
    <div class="error-msg" id="createError"></div>
  </div>

  <div class="card">
    <h2>📱 Sessions</h2>
    <div id="sessionsContainer"><div class="empty">No sessions yet.</div></div>
  </div>
</div>

<!-- Group modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div style="flex:1;min-width:0;">
        <h3 id="modalTitle">Group</h3>
        <div class="uid-line" id="modalUid"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕ Close</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="empty">Loading members...</div>
    </div>
    <div class="modal-actions">
      <button class="primary" onclick="downloadMembersCSV()">⬇ Download CSV</button>
    </div>
  </div>
</div>

<div class="copy-toast" id="toast">Copied!</div>

<script>
let currentGroup = null;   // { sessionId, groupJid, subject }
let refreshTimer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (r.status === 401) { window.location.href = '/login.html'; return; }
  return r.json();
}

async function createSession() {
  const btn = document.getElementById('createBtn');
  const input = document.getElementById('phoneInput');
  const err = document.getElementById('createError');
  err.textContent = '';
  const phone = input.value.trim();
  if (!phone) { err.textContent = 'Enter a phone number'; return; }

  btn.disabled = true;
  btn.textContent = 'Creating...';

  const data = await api('/api/sessions/create', {
    method: 'POST',
    body: JSON.stringify({ phoneNumber: phone })
  });

  btn.disabled = false;
  btn.textContent = 'Get Pairing Code';

  if (!data.success) { err.textContent = data.error || 'Failed'; return; }
  input.value = '';
  loadSessions();
}

async function loadSessions() {
  const data = await api('/api/sessions');
  if (!Array.isArray(data)) return;

  const container = document.getElementById('sessionsContainer');
  if (data.length === 0) {
    container.innerHTML = '<div class="empty">No sessions yet. Create one above.</div>';
    return;
  }
  container.innerHTML = data.map(s => renderSession(s)).join('');
}

function renderSession(s) {
  const dot = s.isConnected ? 'online' : (s.error ? 'offline' : '');
  const statusText = s.isConnected ? 'Connected' : (s.pairingCode ? 'Waiting for pairing' : 'Connecting...');

  return `
    <div class="session">
      <div class="session-head">
        <div class="session-title">
          <span class="dot ${dot}"></span>
          <span>+${s.phoneNumber}</span>
          <span class="badge ${s.isConnected ? 'green' : 'amber'}">${statusText}</span>
          ${s.autoRefresh ? '<span class="badge blue">🔄 Auto 5min</span>' : ''}
          <span class="badge">${s.groupsCount} groups</span>
          ${s.lastFetchedFormatted ? `<span class="badge">Updated: ${s.lastFetchedFormatted}</span>` : ''}
        </div>
        <div class="session-actions">
          ${s.isConnected ? `
            <button onclick="refreshGroups('${s.sessionId}', this)">🔄 Refresh</button>
            <button onclick="toggleAuto('${s.sessionId}', ${!s.autoRefresh})">
              ${s.autoRefresh ? '⏹ Stop Auto' : '▶ Auto 5min'}
            </button>
            <button onclick="downloadJSON('${s.sessionId}')">⬇ JSON</button>
            <button onclick="downloadTXT('${s.sessionId}')">⬇ TXT</button>
          ` : ''}
          <button class="danger" onclick="stopSession('${s.sessionId}')">🗑 Stop</button>
        </div>
      </div>

      ${s.pairingCode && !s.isConnected ? `
        <div class="pairing-code">
          <div style="font-size:13px;color:#94a3b8;">
            Open WhatsApp → Linked Devices → Link with phone number → Enter this code
          </div>
          <div class="code">${s.pairingCode}</div>
          <div class="hint">Expires in ~10 minutes</div>
        </div>
      ` : ''}

      ${s.error ? `<div class="error-msg">⚠ ${s.error}</div>` : ''}

      ${s.isConnected && s.groupsCount > 0 ? `<div id="groups-${s.sessionId}" class="groups-grid"><div class="empty">Loading...</div></div>` : ''}
      ${s.isConnected && s.groupsCount === 0 ? '<div class="empty">No groups found.</div>' : ''}
    </div>
  `;
}

async function loadGroups(sessionId) {
  const el = document.getElementById('groups-' + sessionId);
  if (!el) return;

  const data = await api('/api/sessions/' + sessionId);
  if (!data || !data.groups) return;

  if (data.groups.length === 0) {
    el.innerHTML = '<div class="empty">No groups found.</div>';
    return;
  }

  el.innerHTML = data.groups.map(g => `
    <div class="group-card" onclick="openGroup('${sessionId}', '${encodeURIComponent(g.fullJid)}', '${escapeAttr(g.subject)}')">
      <div class="name">👥 ${escapeHtml(g.subject)}</div>
      <div class="uid">UID: ${g.groupId}</div>
      <div class="meta">
        <span class="badge blue">${g.participantsCount} members</span>
        ${g.creation ? `<span class="badge">Created: ${g.creation}</span>` : ''}
      </div>
    </div>
  `).join('');
}

async function refreshGroups(id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
  await api(`/api/sessions/${id}/refresh`, { method: 'POST' });
  if (btn) { btn.disabled = false; btn.textContent = '🔄 Refresh'; }
  loadSessions();
}

async function toggleAuto(id, enabled) {
  await api(`/api/sessions/${id}/auto-refresh`, {
    method: 'POST',
    body: JSON.stringify({ enabled, intervalMinutes: 5 })
  });
  loadSessions();
}

async function stopSession(id) {
  if (!confirm('Stop and delete this session permanently?')) return;
  await api(`/api/sessions/${id}/stop`, {
    method: 'POST',
    body: JSON.stringify({ deleteAuth: true })
  });
  loadSessions();
}

function downloadJSON(id) { window.location.href = `/api/sessions/${id}/download.json`; }
function downloadTXT(id)  { window.location.href = `/api/sessions/${id}/download.txt`; }

// ============ MODAL: open group + members ============
async function openGroup(sessionId, encodedJid, subject) {
  currentGroup = { sessionId, groupJid: decodeURIComponent(encodedJid), subject };

  const overlay = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const uid = document.getElementById('modalUid');
  const body = document.getElementById('modalBody');

  title.textContent = '👥 ' + subject;
  uid.textContent = 'Loading...';
  body.innerHTML = '<div class="empty">Loading members and profiles... This may take a few seconds.</div>';
  overlay.classList.add('show');

  const data = await api(`/api/sessions/${sessionId}/group/${encodeURIComponent(currentGroup.groupJid)}`);
  if (!data || !data.success) {
    body.innerHTML = `<div class="error-msg">⚠ ${(data && data.error) || 'Failed to load group'}</div>`;
    return;
  }

  const g = data.group;
  currentGroup.groupId = g.groupId;
  currentGroup.subject = g.subject;

  title.textContent = '👥 ' + g.subject;
  uid.textContent = 'UID: ' + g.groupId;

  const adminsCount = g.members.filter(m => m.isAdmin).length;
  const withPics = g.members.filter(m => m.profilePic).length;

  body.innerHTML = `
    <div class="stat-row">
      <span class="s">📊 <b>${g.participantsCount}</b> members</span>
      <span class="s">👑 <b>${adminsCount}</b> admins</span>
      <span class="s">🖼 <b>${withPics}</b> with photos</span>
      ${g.creation ? `<span class="s">📅 Created: ${g.creation}</span>` : ''}
      ${g.owner ? `<span class="s">👤 Owner: +${g.owner}</span>` : ''}
    </div>
    ${g.desc ? `<div style="color:#94a3b8;font-size:13px;margin-bottom:12px;">📝 ${escapeHtml(g.desc)}</div>` : ''}
    <div class="search-box">
      <input type="text" id="memberSearch" placeholder="🔍 Search by phone number or JID..." oninput="filterMembers(this.value)">
    </div>
    <div id="membersList">
      ${g.members.map(m => renderMember(m)).join('')}
    </div>
  `;
}

function renderMember(m) {
  const role = m.isSuperAdmin ? '👑 Super Admin' : m.isAdmin ? '🛡 Admin' : 'Member';
  const roleClass = m.isSuperAdmin ? 'super' : m.isAdmin ? 'admin' : '';

  const avatar = m.profilePic
    ? `<img src="${m.profilePic}" alt="" onerror="this.outerHTML='<div class=\\'avatar\\'>${(m.phone || '?').slice(-2)}</div>'">`
    : `<div class="avatar">${(m.phone ? m.phone.slice(-2) : '?')}</div>`;

  const phoneClass = m.isLid ? 'lid' : '';

  return `
    <div class="member" data-search="${(m.phone || '')} ${m.jid}">
      ${avatar}
      <div class="info">
        <div class="phone ${phoneClass}">${escapeHtml(m.displayPhone)}</div>
        <div class="jid">${escapeHtml(m.jid)}</div>
      </div>
      <span class="role ${roleClass}">${role}</span>
    </div>
  `;
}

function filterMembers(q) {
  const search = q.toLowerCase().trim();
  document.querySelectorAll('#membersList .member').forEach(el => {
    const hay = el.getAttribute('data-search').toLowerCase();
    el.style.display = !search || hay.includes(search) ? '' : 'none';
  });
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  currentGroup = null;
}

function downloadMembersCSV() {
  if (!currentGroup) return;
  window.location.href = `/api/sessions/${currentGroup.sessionId}/group/${encodeURIComponent(currentGroup.groupJid)}/members.csv`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

async function logout() {
  await api('/api/logout');
  window.location.href = '/login.html';
}

// Poll every 3 seconds
async function tick() {
  await loadSessions();
  const data = await api('/api/sessions');
  if (Array.isArray(data)) {
    for (const s of data) {
      if (s.isConnected && s.groupsCount > 0) {
        loadGroups(s.sessionId);
      }
    }
  }
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

tick();
refreshTimer = setInterval(tick, 3000);
</script>
</body>
</html>
